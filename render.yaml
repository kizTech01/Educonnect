services:
  - type: web
    name: educonnect-web
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Temporary read-only metadata capture for the production schema incident.
    # Keep the single migration command; remove the diagnostic after its log is
    # captured and the production schema has been reconciled.
    preDeployCommand: python manage.py diagnose_production_schema && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 60
    disk:
      name: educonnect-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: CORE_DOMAIN
        value: educonnect.devs.surf
      - key: DJANGO_TIME_ZONE
        value: Africa/Lagos
      # Filesystem media remains available only for non-R2 fallback deployments.
      - key: DJANGO_MEDIA_ROOT
        value: /opt/render/project/src/media
      # Keep R2 private. Values are configured in Render, never committed.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_DEFAULT_ACL
        sync: false
      - key: AWS_QUERYSTRING_AUTH
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: cron
    name: educonnect-subscription-notifications
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_subscription_expiry_notifications
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_S3_ENDPOINT_URL
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_S3_ENDPOINT_URL
      - key: AWS_S3_REGION_NAME
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_S3_REGION_NAME
      - key: AWS_DEFAULT_ACL
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_DEFAULT_ACL
      - key: AWS_QUERYSTRING_AUTH
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_QUERYSTRING_AUTH
      - key: DJANGO_TIME_ZONE
        value: Africa/Lagos
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: educonnect-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: cron
    name: educonnect-course-reminders
    runtime: python
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_due_course_reminders
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_S3_ENDPOINT_URL
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_S3_ENDPOINT_URL
      - key: AWS_S3_REGION_NAME
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_S3_REGION_NAME
      - key: AWS_DEFAULT_ACL
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_DEFAULT_ACL
      - key: AWS_QUERYSTRING_AUTH
        fromService:
          type: web
          name: educonnect-web
          envVarKey: AWS_QUERYSTRING_AUTH
      - key: DJANGO_TIME_ZONE
        value: Africa/Lagos
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: educonnect-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: educonnect-db
    plan: basic-1gb
