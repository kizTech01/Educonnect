services:
  web:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Always use the local SQLite database while developing in Docker.
      DJANGO_USE_LOCAL_SQLITE: "True"
