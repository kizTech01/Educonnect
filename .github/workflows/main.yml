name: EduConnect Docker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Docker version
        run: |
          docker --version
          docker compose version

      - name: Build EduConnect image
        run: docker build -t educonnect-test .

      - name: Run Django system check
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=github-actions-test-key \
            -e DJANGO_DEBUG=True \
            -e DJANGO_USE_LOCAL_SQLITE=True \
            -e DJANGO_TIME_ZONE=Africa/Lagos \
            educonnect-test \
            python manage.py check

      - name: Check migrations
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=github-actions-test-key \
            -e DJANGO_DEBUG=True \
            -e DJANGO_USE_LOCAL_SQLITE=True \
            -e DJANGO_TIME_ZONE=Africa/Lagos \
            educonnect-test \
            python manage.py makemigrations --check --dry-run

      - name: Test static files
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=github-actions-test-key \
            -e DJANGO_DEBUG=True \
            -e DJANGO_USE_LOCAL_SQLITE=True \
            -e DJANGO_TIME_ZONE=Africa/Lagos \
            educonnect-test \
            python manage.py collectstatic --noinput

      - name: Run Django tests
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=github-actions-test-key \
            -e DJANGO_DEBUG=True \
            -e DJANGO_USE_LOCAL_SQLITE=True \
            -e DJANGO_TIME_ZONE=Africa/Lagos \
            educonnect-test \
            python manage.py test

      - name: Start production container
        run: |
          docker run -d \
            --name educonnect-container \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY=github-actions-production-test-key \
            -e DJANGO_DEBUG=False \
            -e DJANGO_USE_LOCAL_SQLITE=True \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_TIME_ZONE=Africa/Lagos \
            educonnect-test

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/; then
              echo "EduConnect is responding successfully."
              exit 0
            fi

            echo "Waiting for EduConnect..."
            sleep 2
          done

          echo "EduConnect failed to respond."
          docker logs educonnect-container
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs educonnect-container || true

      - name: Stop container
        if: always()
        run: docker rm -f educonnect-container || true
