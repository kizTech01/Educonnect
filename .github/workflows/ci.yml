name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_DEBUG: "True"
      DJANGO_USE_LOCAL_SQLITE: "True"
      DJANGO_TEST_FAST_PASSWORD_HASHER: "True"
      DJANGO_SECRET_KEY: ci-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDE
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORE_DOMAIN: educonnect.com
      DJANGO_TIME_ZONE: Africa/Lagos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Test static files
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test --verbosity 2

      - name: Validate production settings
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDE
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          AWS_ACCESS_KEY_ID: ci-r2-access-key
          AWS_SECRET_ACCESS_KEY: ci-r2-secret-key
          AWS_STORAGE_BUCKET_NAME: educonnect-ci
          AWS_S3_ENDPOINT_URL: https://example.invalid
          AWS_S3_REGION_NAME: auto
          AWS_QUERYSTRING_AUTH: "True"
        run: python manage.py check --deploy

  postgresql-payment-locking:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: educonnect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d educonnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_USE_LOCAL_SQLITE: "False"
      DJANGO_TEST_FAST_PASSWORD_HASHER: "True"
      DJANGO_SECRET_KEY: ci-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDE
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORE_DOMAIN: educonnect.com
      DJANGO_TIME_ZONE: Africa/Lagos
      DB_ENGINE: postgresql
      DB_NAME: educonnect_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PostgreSQL row-locking regression test
        run: >-
          python manage.py test
          portal.tests.DashboardAndCourseFlowTests.test_course_payment_finalization_locks_a_payment_with_a_null_session_on_postgresql
          --verbosity 2
