{% extends 'base.html' %}

{% block title %}Reset Password | Educonnect{% endblock %}

{% block content %}
<section class="login-section auth-page"><div class="container"><div class="auth-grid"><div class="login-card auth-card">
    <span class="card-tag">Password reset</span><h3>Reset your password</h3>
    <p>Enter the email address on your account and we will send a verification link.</p>
    <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="primary-btn full-width" type="submit">Send Reset Link</button></form>
    <a href="{% url 'portal:home' %}" class="ghost-btn small">Back to Home</a>
</div></div></div></section>
{% endblock %}
