{% extends 'base.html' %}

{% block title %}Password Reset Sent | Educonnect{% endblock %}

{% block content %}
<main class="page-shell">
    <section class="container panel-card" style="margin-top: 2rem; margin-bottom: 2rem;">
        <div class="panel-head">
            <h2>Check Your Email</h2>
        </div>
        <p class="muted-note">If the email belongs to an active account, a six-digit verification code has been sent. Enter it to choose a new password.</p>
        <a href="{% url 'portal:password-reset' %}" class="primary-btn small">Enter verification code</a>
    </section>
</main>
{% endblock %}
